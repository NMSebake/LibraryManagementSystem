<h2>Book List</h2>
<div class="book-container">
  @for (book of books; track book.id) {
    <div class="book-card">
      <img [src]="book.bookcover" [alt]="book.title" class="book-cover" width="100" />

      <div class="book-info">
        <h3>{{ book.title }}</h3>
        <!-- <p>Author: {{ book.author }}</p>
        <p>Category: {{ book.category }}</p>
        <p>Publisher: {{ book.publisher }}</p>
        <p>Published: {{ book.publishedYear }}</p>
        <p>Available Copies: {{ book.totalcopies }}</p> -->
        <button (click)="viewDetails(books[0].title)">View Details</button>
        <button>Rent Book</button>
      </div>
    </div>
  } @empty {
    <p>No books available</p>
  }
</div>
