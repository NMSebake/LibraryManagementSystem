<h2>Book List</h2>
<div class="book-container">
  @for (book of books; track book.id) {
    <div class="book-card">
      <img [src]="book.bookcover" [alt]="book.title" class="book-cover" width="100" />

      <div class="book-info">
        <h3>{{ book.title }}</h3>
      </div>
    </div>
  } @empty {
    <p>No books available</p>
  }
</div>
